name: Build Duolingo 6.104.5 MPP

on:
  workflow_dispatch:
  push:
    branches:
      - duolingo-6.104.5
    paths:
      - .github/workflows/build_duolingo.yml
      - patches/src/main/kotlin/hoodles/morphe/patches/duolingo/**
      - patches/src/main/kotlin/hoodles/morphe/util/**
      - patches/build.gradle.kts
      - gradle/**
      - settings.gradle.kts

permissions:
  contents: read
  packages: read

jobs:
  build-duolingo:
    name: Build Duolingo-only patch bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Java 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Keep only Duolingo patch sources
        shell: bash
        run: |
          set -euo pipefail
          patch_dir=patches/src/main/kotlin/hoodles/morphe/patches
          test -f "$patch_dir/duolingo/premium/EnablePremiumPatch.kt"
          # Prune only the CI working tree; repository files are not changed.
          find "$patch_dir" -mindepth 1 -maxdepth 1 ! -name duolingo -exec rm -rf -- {} +
          # Keep shared extensions but remove app-specific extension modules.
          find extensions -mindepth 1 -maxdepth 1 -type d ! -name shared -exec rm -rf -- {} +
          rm -rf patches/src/main/resources patches/pairip

          cat > patches/src/main/kotlin/hoodles/morphe/compatibility/Constants.kt <<'EOF'
          package hoodles.morphe.compatibility

          import app.morphe.patcher.patch.AppTarget
          import app.morphe.patcher.patch.Compatibility

          object Compat {
              val DUOLINGO = Compatibility(
                  name = "Duolingo",
                  packageName = "com.duolingo",
                  appIconColor = 0x58CC02,
                  targets = listOf(AppTarget("6.104.5"))
              )
          }
          EOF

          sed -i 's/name = "Hoodles Morphe Patches"/name = "Duolingo 6.104.5 (Custom)"/' patches/build.gradle.kts
          sed -i 's/description = "Various patches for use with Morphe"/description = "Duolingo 6.104.5 patch bundle for Morphe Manager"/' patches/build.gradle.kts
          sed -i 's|source = "git@github.com:hoo-dles/morphe-patches.git"|source = "https://github.com/VerdantGoosePath/morphe-patches"|' patches/build.gradle.kts

          grep -Fq 'name = "Duolingo 6.104.5 (Custom)"' patches/build.gradle.kts
          grep -Fq 'AppTarget("6.104.5")' patches/src/main/kotlin/hoodles/morphe/compatibility/Constants.kt
          test "$(find "$patch_dir" -name '*.kt' | wc -l)" -gt 0
          echo "Duolingo Kotlin sources included:"
          find "$patch_dir" -name '*.kt' -print

      - name: Build Morphe Manager bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Verify and prepare MPP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(patches/build/libs/patches-*.mpp)
          if (( ${#bundles[@]} != 1 )); then
            printf 'Expected exactly one .mpp, found %d\n' "${#bundles[@]}" >&2
            ls -lah patches/build/libs/ || true
            exit 1
          fi
          test -s "${bundles[0]}"
          mkdir -p dist
          cp "${bundles[0]}" dist/duolingo-6.104.5.mpp
          file dist/duolingo-6.104.5.mpp
          sha256sum dist/duolingo-6.104.5.mpp

      - name: Upload Duolingo MPP
        uses: actions/upload-artifact@v4
        with:
          name: duolingo-6.104.5-mpp
          path: dist/duolingo-6.104.5.mpp
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
